<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş tamam</title>
<style>body{font:16px system-ui;background:#f4efe4;color:#1f2f5c;max-width:640px;margin:10vh auto;padding:0 16px}
textarea{width:100%;height:120px;font:13px ui-monospace,monospace;padding:8px;border:1px solid #1f2f5c;border-radius:6px}
button{margin-top:10px;padding:10px 18px;border:0;border-radius:6px;background:#1f2f5c;color:#fff;font-size:15px}</style>
<h2>İzin verildi ✓</h2><p>Bu adresi kopyala ve terminale yapıştır. Bu sayfa hiçbir yere bir şey göndermez.</p>
<textarea id="u" readonly></textarea><br><button onclick="navigator.clipboard.writeText(u.value);this.textContent='Kopyalandı'">Kopyala</button>
<script>u.value=location.href</script></html>
